<title>Paper Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Krona+One&display=swap">
<script>const cw=console.warn;console.warn=(...a)=>{if(!String(a[0]).includes('cdn.tailwindcss.com'))cw(...a)}</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{deep:'#162140',matte:'#31507A',sky:'#9ACCE5',gold:'#FFD400',charcoal:'#525F7A'},fontFamily:{display:['Nordt','"Krona One"','sans-serif'],body:['"DM Sans"','system-ui','sans-serif']}}}}</script>
<style>
:root{--deep:#162140;--matte:#31507A;--sky:#9ACCE5;--white:#FFFFFF;--gold:#FFD400;--charcoal:#525F7A;color-scheme:dark}
html,body{height:100%;background:var(--deep);overflow:hidden}
.stage{background:repeating-linear-gradient(to bottom,rgb(255 255 255/.03) 0 1px,transparent 1px 4px),linear-gradient(180deg,#1d2c55 0%,var(--deep) 100%);touch-action:none}
</style>
<main id="stage" class="stage relative h-full w-full overflow-hidden select-none font-body text-white">
<canvas id="sky" class="absolute inset-0 h-full w-full" aria-label="Paper plane flying through a maze of bars"></canvas>
<header class="pointer-events-none absolute inset-x-0 top-0 flex items-start justify-between p-6 sm:p-10">
<svg class="h-10 w-10 sm:h-12 sm:w-12" viewBox="0 0 100 100" role="img" aria-label="Galvanite"><defs><clipPath id="gTop"><polygon points="2,0 100,0 100,25 27,25"/></clipPath><clipPath id="gC"><polygon points="0,6 94,100 0,100"/></clipPath></defs><g clip-path="url(#gTop)" fill="#9ACCE5"><circle cx="50" cy="50" r="37.5" fill="none" stroke="#9ACCE5" stroke-width="25"/><rect x="50" y="0" width="50" height="25"/></g><g clip-path="url(#gC)" fill="#FFFFFF"><circle cx="50" cy="50" r="37.5" fill="none" stroke="#FFFFFF" stroke-width="25"/><rect x="50" y="75" width="50" height="25"/></g><polygon points="57,50 100,50 100,93" fill="#FFD400"/></svg>
<ul id="lives" class="flex gap-2 sm:gap-3" aria-label="Lives">
<li class="text-gold transition-colors duration-300"><svg class="h-6 w-8 sm:h-8 sm:w-11" viewBox="0 0 44 32" fill="currentColor"><polygon points="0,10 10,0 22,12 34,0 44,10 22,32"/></svg></li>
<li class="text-gold transition-colors duration-300"><svg class="h-6 w-8 sm:h-8 sm:w-11" viewBox="0 0 44 32" fill="currentColor"><polygon points="0,10 10,0 22,12 34,0 44,10 22,32"/></svg></li>
<li class="text-gold transition-colors duration-300"><svg class="h-6 w-8 sm:h-8 sm:w-11" viewBox="0 0 44 32" fill="currentColor"><polygon points="0,10 10,0 22,12 34,0 44,10 22,32"/></svg></li>
</ul>
</header>
<footer class="pointer-events-none absolute bottom-0 left-0 p-6 sm:p-10">
<p id="level" class="font-display text-sm tracking-wider sm:text-base">LEVEL 1</p>
<p id="timer" class="font-display text-4xl tabular-nums sm:text-5xl">0:30</p>
</footer>
<section id="panel" class="absolute left-1/2 top-1/2 w-[calc(100%-32px)] max-w-md -translate-x-1/2 -translate-y-1/2 rounded-md border border-sky/20 bg-deep/90 p-8 backdrop-blur-sm">
<h1 id="panelTitle" class="font-display text-2xl leading-tight [text-wrap:balance] sm:text-3xl">Close the gap</h1>
<p id="panelText" class="mt-4 text-base leading-relaxed text-sky">Steer the paper plane with your mouse and thread it through the gaps. Each level lasts 30 seconds, and the bars speed up as you go. Press Esc to pause.</p>
<button id="startBtn" type="button" class="mt-8 rounded-md bg-gold px-6 py-3 font-display text-sm uppercase tracking-wider text-deep transition-colors hover:bg-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-deep">Start flying</button>
</section>
<form id="tune" hidden class="absolute bottom-20 right-6 w-72 max-w-[calc(100%-48px)] cursor-auto rounded-md border border-sky/20 bg-deep/90 p-5 backdrop-blur-sm sm:bottom-24 sm:right-10">
<h2 class="font-display text-sm uppercase tracking-wider">Flight tuning</h2>
<div id="sliders" class="mt-5 grid gap-4"></div>
<p class="mt-5 flex justify-between text-sm"><span>Current speed</span><output id="o-now" class="tabular-nums text-sky">100%</output></p>
<label for="t-god" class="mt-5 flex items-center justify-between text-sm"><span>Indestructible</span><input id="t-god" type="checkbox" class="h-4 w-4 accent-gold"></label>
<div class="mt-5 flex items-center justify-between gap-4">
<button id="tuneReset" type="button" class="rounded-md border border-sky/30 px-3 py-2 text-xs font-medium text-sky transition-colors hover:border-white hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white">Reset defaults</button>
<p class="text-xs text-charcoal">Press T to toggle</p>
</div>
</form>
<div class="absolute bottom-6 right-6 flex gap-2 sm:bottom-10 sm:right-10">
<button id="fsBtn" type="button" title="Press F" class="cursor-auto rounded-md border border-sky/30 bg-deep/80 px-4 py-2 font-display text-xs uppercase tracking-wider text-sky transition-colors hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white">Fullscreen</button>
<button id="tuneBtn" type="button" title="Press T" aria-controls="tune" aria-expanded="false" class="cursor-auto rounded-md border border-sky/30 bg-deep/80 px-4 py-2 font-display text-xs uppercase tracking-wider text-sky transition-colors hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white">Tune</button>
</div>
</main>
<script>
const stage=document.getElementById('stage'),cv=document.getElementById('sky'),cx=cv.getContext('2d');
const ui={level:document.getElementById('level'),timer:document.getElementById('timer'),lives:[...document.querySelectorAll('#lives li')],panel:document.getElementById('panel'),title:document.getElementById('panelTitle'),text:document.getElementById('panelText'),btn:document.getElementById('startBtn'),tune:document.getElementById('tune'),tuneBtn:document.getElementById('tuneBtn'),sliders:document.getElementById('sliders'),god:document.getElementById('t-god'),reset:document.getElementById('tuneReset'),now:document.getElementById('o-now'),fs:document.getElementById('fsBtn')};
const LEVEL_TIME=30,DEF={plane:.85,bars:.5,course:2.5,speed:1,accel:1,inertia:2,god:true};
const SPEC=[['plane','Plane size',.3,1.5],['bars','Obstacle size',.3,1.5],['course','Course scale',.4,2.5],['speed','Speed',.25,2.5],['accel','Acceleration',0,2.5],['inertia','Inertia',.2,3]];
let cfg={...DEF};try{Object.assign(cfg,JSON.parse(localStorage.getItem('pp-tune')||'{}'))}catch(e){}
const P={x:0,y:0,vx:0,vy:0,tx:0,ty:0,a:0,lift:0,L:120};
let W=0,H=0,BW=20,bars=[],nextX=0,prev='bottom',state='ready',level=1,lives=3,left=LEVEL_TIME,flown=0,inv=0,boost=1,last=performance.now();
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b),rand=(a,b)=>a+Math.random()*(b-a);
const bounds=()=>{const minX=P.L*.5+16,maxX=Math.max(minX,W/2-P.L*.5);return{minX,maxX,minY:P.L*.3+8,maxY:H-P.L*.3-8}};
const speed=()=>W*.22*cfg.speed*boost;
const fmt=s=>{s=Math.max(0,Math.ceil(s));return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
function sizes(){P.L=clamp(Math.min(W*.15,H*.24),72,240)*cfg.plane;BW=clamp(W*.015,14,30)*cfg.bars}
function resize(){const oW=W,oH=H,dpr=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);sizes();if(!oW){P.tx=W*.3;P.y=P.ty=H*.45;const B=bounds();P.x=B.minX+(B.maxX-B.minX)*.3;build(W*.62);return}const sx=W/oW,sy=H/oH;bars.forEach(b=>{b.x*=sx;b.y0*=sy;b.y1*=sy});nextX*=sx;P.x*=sx;P.y*=sy;P.tx*=sx;P.ty*=sy}
function spawn(x){const kind=Math.random()<.3?'pair':(prev==='top'?'bottom':'top');prev=kind;const open=()=>H*rand(.4,.6);
if(kind==='top')bars.push({x,y0:0,y1:H-open()});else if(kind==='bottom')bars.push({x,y0:open(),y1:H});
else{const g=H*Math.max(.26,.36-.015*(level-1)),m=rand(g/2+H*.1,H-g/2-H*.1);bars.push({x,y0:0,y1:m-g/2},{x,y0:m+g/2,y1:H})}}
function fill(){while(nextX<W+BW){spawn(nextX);nextX+=Math.max(200,W*rand(.3,.42))*cfg.course}}
function build(x){bars=[];nextX=x;fill()}
function respace(r){const a=P.x+P.L;bars.forEach(b=>{if(b.x>a)b.x=a+(b.x-a)*r});nextX=a+(nextX-a)*r;fill()}
function setLives(){ui.lives.forEach((li,i)=>{li.classList.toggle('text-gold',i<lives);li.classList.toggle('text-charcoal',i>=lives)})}
function setLevel(){ui.level.textContent=`LEVEL ${level}`}
function start(){if(state==='over')build(W*.85);state='play';level=1;lives=3;left=LEVEL_TIME;flown=0;inv=0;boost=1;setLives();setLevel();ui.panel.hidden=true;stage.classList.add('cursor-none')}
function over(){state='over';stage.classList.remove('cursor-none');ui.title.textContent=`Grounded on level ${level}`;ui.text.textContent=`You flew for ${fmt(flown)}. Three hits and the flight is over.`;ui.btn.textContent='Fly again';ui.panel.hidden=false;ui.btn.focus()}
function pause(){state='paused';stage.classList.remove('cursor-none');ui.title.textContent='Paused';ui.text.textContent='Press Esc or Resume to keep flying.';ui.btn.textContent='Resume';ui.panel.hidden=false}
function resume(){state='play';ui.panel.hidden=true;stage.classList.add('cursor-none')}
function aim(e){const r=cv.getBoundingClientRect();P.tx=e.clientX-r.left;P.ty=e.clientY-r.top}
ui.sliders.innerHTML=SPEC.map(([k,l,mn,mx])=>`<label for="t-${k}" class="grid gap-2 text-sm"><span class="flex justify-between"><span>${l}</span><output id="o-${k}" class="tabular-nums text-sky"></output></span><input id="t-${k}" type="range" min="${mn}" max="${mx}" step="0.05" class="w-full accent-gold"></label>`).join('');
function syncTune(){SPEC.forEach(([k])=>{document.getElementById('t-'+k).value=cfg[k];document.getElementById('o-'+k).textContent=Math.round(cfg[k]*100)+'%'});ui.god.checked=cfg.god}
function saveTune(){sizes();syncTune();try{localStorage.setItem('pp-tune',JSON.stringify(cfg))}catch(e){}}
function toggleTune(){ui.tune.hidden=!ui.tune.hidden;ui.tuneBtn.setAttribute('aria-expanded',String(!ui.tune.hidden))}
ui.tune.addEventListener('input',e=>{const k=e.target.id.slice(2);if(k==='god')cfg.god=e.target.checked;else{if(k==='course')respace(+e.target.value/cfg.course);cfg[k]=+e.target.value}saveTune()});
ui.tune.addEventListener('submit',e=>e.preventDefault());
ui.reset.addEventListener('click',()=>{respace(DEF.course/cfg.course);cfg={...DEF};saveTune()});
ui.tuneBtn.addEventListener('click',toggleTune);
ui.fs.hidden=!document.fullscreenEnabled;
function toggleFs(){if(ui.fs.hidden)return;(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{ui.fs.hidden=true})}
ui.fs.addEventListener('click',toggleFs);
document.addEventListener('fullscreenchange',()=>{ui.fs.textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen';if(!document.fullscreenElement&&state==='play')pause()});
[ui.tune,ui.tuneBtn,ui.fs].forEach(el=>el.addEventListener('pointermove',e=>e.stopPropagation()));
stage.addEventListener('pointermove',aim);stage.addEventListener('pointerdown',e=>{if(!e.target.closest('#tune,#tuneBtn,#fsBtn'))aim(e)});
ui.btn.addEventListener('click',()=>state==='paused'?resume():start());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});
addEventListener('keydown',e=>{if(e.key==='t'||e.key==='T')toggleTune();else if(e.key==='f'||e.key==='F')toggleFs();else if(e.key==='Escape'){if(state==='play')pause();else if(state==='paused')resume()}else if(e.key==='Enter'&&state!=='play'&&!e.target.closest('button,#tune'))state==='paused'?resume():start()});
addEventListener('resize',resize);
const SHAPE=[[.5,0],[-.36,-.2],[-.5,.17],[-.27,.27],[0,0],[.15,.02]];
function hit(){const c=Math.cos(P.a),s=Math.sin(P.a);return SHAPE.some(([lx,ly])=>{lx*=.85*P.L;ly*=.85*P.L;const px=P.x+lx*c-ly*s,py=P.y+lx*s+ly*c;return bars.some(b=>px>=b.x&&px<=b.x+BW&&py>=b.y0&&py<=b.y1)})}
function update(dt){if(state==='paused')return;const B=bounds(),wx=1/(.45*cfg.inertia),wy=1/(.3*cfg.inertia);
const tx=B.minX+(B.maxX-B.minX)*clamp(P.tx/W,0,1),ty=clamp(P.ty,B.minY,B.maxY);
P.vx+=(wx*wx*(tx-P.x)-2*wx*P.vx)*dt;P.vy+=(wy*wy*(ty-P.y)-2*wy*P.vy)*dt;P.x+=P.vx*dt;P.y+=P.vy*dt;
if(P.x>B.maxX||P.x<B.minX){P.x=clamp(P.x,B.minX,B.maxX);P.vx=0}if(P.y>B.maxY||P.y<B.minY){P.y=clamp(P.y,B.minY,B.maxY);P.vy=0}
const pos=1-2*(P.y-B.minY)/(B.maxY-B.minY),lean=clamp(-P.vy/(H*.6),-1,1);
P.lift+=((pos+lean)/2-P.lift)*(1-Math.exp(-dt/.15));P.a=-P.lift*.09;
if(state!=='play')return;
const d=speed()*dt;bars.forEach(b=>b.x-=d);nextX-=d;bars=bars.filter(b=>b.x+BW>0);fill();
flown+=dt;left-=dt;boost=Math.min(boost*Math.pow(1.02,cfg.accel/2.5*dt),4);if(left<=0){level++;left=LEVEL_TIME;setLevel()}
if(inv>0)inv-=dt;else if(hit()){inv=cfg.god?.6:1.6;if(!cfg.god){lives--;setLives();if(!lives)over()}}}
function plane(){cx.save();cx.translate(P.x,P.y);cx.rotate(P.a);cx.scale(P.L,P.L);cx.globalAlpha=inv>0&&state==='play'&&Math.floor(inv*10)%2?.35:1;
const poly=(pts,f)=>{cx.beginPath();pts.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.closePath();cx.fillStyle=f;cx.fill()};
poly([[.5,0],[-.18,.1+.02*P.lift],[-.27,.27+.06*P.lift]],'#BFDDEE');
poly([[.5,0],[-.2,-.02],[-.5,.17],[-.18,.1+.02*P.lift]],'#FFFFFF');
poly([[.5,0],[-.36,-.2],[-.2,-.02]],'#E3F0F8');
cx.beginPath();cx.moveTo(.5,0);cx.lineTo(-.2,-.02);cx.moveTo(.5,0);cx.lineTo(-.18,.1+.02*P.lift);cx.strokeStyle='rgba(154,204,229,.8)';cx.lineWidth=1.2/P.L;cx.stroke();cx.restore()}
function draw(){cx.clearRect(0,0,W,H);cx.fillStyle='rgba(154,204,229,.72)';bars.forEach(b=>cx.fillRect(b.x,b.y0,BW,b.y1-b.y0));plane()}
let shown='',shownNow='';
function frame(now){const dt=Math.min((now-last)/1000,1/30);last=now;update(dt);draw();const s=fmt(left);if(s!==shown){shown=s;ui.timer.textContent=s}const n=Math.round(cfg.speed*boost*100)+'%';if(n!==shownNow){shownNow=n;ui.now.textContent=n}requestAnimationFrame(frame)}
syncTune();resize();setLives();requestAnimationFrame(frame);
</script>
